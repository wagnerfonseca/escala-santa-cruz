<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Escala e repertório do Conjunto Geral Santa Cruz" />
  <title>Conjunto Geral Santa Cruz · Escala</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1 id="brandTitle">Conjunto Geral Santa Cruz</h1>
        <span>Escala e repertório</span>
      </div>
      <div class="controls">
        <div class="year-pills" id="yearPills" role="tablist" aria-label="Ano"></div>
        <div class="search">
          <label class="visually-hidden" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Buscar</label>
          <input id="q" type="search" placeholder="Buscar música ou músico" autocomplete="off" />
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="searchPanel" class="search-panel" aria-live="polite"></section>

    <section id="hero" class="hero" aria-label="Próximo culto e mês atual"></section>

    <section id="dash" class="dash" aria-label="Painel do ano"></section>

    <section id="months" aria-label="Lista de meses"></section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>Mockup · dados do WhatsApp (somente leitura)</span>
      <span id="updated"></span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
